[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentflow"
version = "0.1.0"
description = "A lightweight runtime for reliable and observable AI agent workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Asghar Hussain" }
]

keywords = [
    "ai",
    "agents",
    "multi-agent",
    "llm",
    "workflow",
    "automation",
    "agentic-ai"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License"
]

dependencies = []

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0.0"
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10"
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
